<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Register</h3>
          
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

          <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" 
                     required minlength="2" maxlength="100" [(ngModel)]="model.name" name="name" #nameInput="ngModel"
                     [ngClass]="{ 'is-invalid': nameInput.invalid && (nameInput.dirty || nameInput.touched) }">
              <div *ngIf="nameInput.invalid && (nameInput.dirty || nameInput.touched)" class="invalid-feedback">
                <span *ngIf="nameInput.errors?.['required']">Name is required.</span>
                <span *ngIf="nameInput.errors?.['minlength']">Name must be at least 2 characters.</span>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" 
                     required email [(ngModel)]="model.email" name="email" #emailInput="ngModel"
                     [ngClass]="{ 'is-invalid': emailInput.invalid && (emailInput.dirty || emailInput.touched) }">
              <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="invalid-feedback">
                <span *ngIf="emailInput.errors?.['required']">Email is required.</span>
                <span *ngIf="emailInput.errors?.['email']">Please enter a valid email address.</span>
              </div>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" 
                     required pattern="^[0-9]{10}$" [(ngModel)]="model.phone" name="phone" #phoneInput="ngModel"
                     [ngClass]="{ 'is-invalid': phoneInput.invalid && (phoneInput.dirty || phoneInput.touched) }">
              <div *ngIf="phoneInput.invalid && (phoneInput.dirty || phoneInput.touched)" class="invalid-feedback">
                <span *ngIf="phoneInput.errors?.['required']">Phone number is required.</span>
                <span *ngIf="phoneInput.errors?.['pattern']">Phone number must be exactly 10 digits.</span>
              </div>
            </div>
            
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" 
                     required minlength="8" [(ngModel)]="model.password" name="password" #passwordInput="ngModel"
                     [ngClass]="{ 'is-invalid': passwordInput.invalid && (passwordInput.dirty || passwordInput.touched) }">
              <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="invalid-feedback">
                <span *ngIf="passwordInput.errors?.['required']">Password is required.</span>
                <span *ngIf="passwordInput.errors?.['minlength']">Password must be at least 8 characters.</span>
              </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100" [disabled]="!registerForm.form.valid || loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Create Account
            </button>
          </form>
          
          <div class="text-center mt-3">
            <p class="mb-0">Already have an account? <a routerLink="/login">Login here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
