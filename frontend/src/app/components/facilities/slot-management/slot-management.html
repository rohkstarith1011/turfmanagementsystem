<div class="container mt-4 mb-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Manage Slots</h2>
    <a routerLink="/facilities" class="btn btn-outline-secondary">Back to Facilities</a>
  </div>

  <div class="row">
    <div class="col-md-4">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Add New Slot</h5>
        </div>
        <div class="card-body">
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
          <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>

          <form (ngSubmit)="onSubmit()" #slotForm="ngForm">
            <div class="mb-3">
              <label for="slotDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="slotDate" required [(ngModel)]="model.slotDate" name="slotDate">
            </div>
            
            <div class="mb-3">
              <label for="startTime" class="form-label">Start Time</label>
              <input type="time" class="form-control" id="startTime" required [(ngModel)]="model.startTime" name="startTime">
            </div>

            <div class="mb-3">
              <label for="endTime" class="form-label">End Time</label>
              <input type="time" class="form-control" id="endTime" required [(ngModel)]="model.endTime" name="endTime">
            </div>

            <div class="mb-4">
              <label for="price" class="form-label">Price ($)</label>
              <input type="number" class="form-control" id="price" required [(ngModel)]="model.price" name="price" min="0">
            </div>

            <button type="submit" class="btn btn-success w-100" [disabled]="!slotForm.form.valid || loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              Create Slot
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Existing Slots</h5>
          <input type="date" class="form-control form-control-sm w-auto" [(ngModel)]="viewDate" (change)="loadSlots()">
        </div>
        <div class="card-body p-0">
          <div *ngIf="slotsLoading" class="text-center p-4">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
          
          <div *ngIf="!slotsLoading && slots.length === 0" class="p-4 text-center text-muted">
            No slots found for this date.
          </div>

          <div class="table-responsive" *ngIf="!slotsLoading && slots.length > 0">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>Time</th>
                  <th>Price</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let slot of slots">
                  <td>{{ slot.startTime }} - {{ slot.endTime }}</td>
                  <td>${{ slot.price }}</td>
                  <td>
                    <span class="badge" [ngClass]="slot.status === 'AVAILABLE' ? 'bg-success' : 'bg-danger'">
                      {{ slot.status }}
                    </span>
                  </td>
                  <td>
                    <button class="btn btn-sm btn-outline-danger" [disabled]="slot.status !== 'AVAILABLE'">Delete</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
