<div class="container mt-4 mb-5">
  <h2 class="mb-4">Find a Turf</h2>

  <div class="row mb-4">
    <div class="col-md-8 mx-auto">
      <div class="input-group input-group-lg shadow-sm">
        <input type="text" class="form-control" placeholder="Search by turf name, city or sport..." [(ngModel)]="searchQuery" (keyup.enter)="search()">
        <button class="btn btn-primary" type="button" (click)="search()">Search</button>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="text-center p-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && facilities.length === 0" class="alert alert-info text-center">
    No facilities found matching your criteria. Try a different search!
  </div>

  <div class="row" *ngIf="!loading && facilities.length > 0">
    <div class="col-md-4 mb-4" *ngFor="let facility of facilities">
      <div class="card h-100 shadow-sm border-0 turf-card">
        <img *ngIf="facility.images && facility.images.length > 0" [src]="facility.images[0].imageUrl" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Facility Image">
        <div *ngIf="!facility.images || facility.images.length === 0" class="card-img-top bg-secondary text-white d-flex align-items-center justify-content-center" style="height: 200px;">
          <span>No Image Available</span>
        </div>
        <div class="card-body">
          <h5 class="card-title text-primary fw-bold">{{ facility.name }}</h5>
          <h6 class="card-subtitle mb-2 text-muted"><i class="bi bi-geo-alt"></i> {{ facility.city }}, {{ facility.state }}</h6>
          <p class="card-text text-truncate mt-3">{{ facility.description }}</p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="badge bg-success"><i class="bi bi-star-fill"></i> {{ facility.averageRating | number:'1.1-1' }}</span>
          </div>
        </div>
        <div class="card-footer bg-white border-0 pt-0">
          <a [routerLink]="['/player/facilities', facility.facilityId]" class="btn btn-outline-primary w-100">View Details & Book</a>
        </div>
      </div>
    </div>
  </div>
</div>
